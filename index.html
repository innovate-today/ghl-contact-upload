<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Your File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1220;
    --ink-soft: #64748b;
    --ink-faint: #94a3b8;
    --rule: #e6e8ec;
    --rule-strong: #d4d8dd;
    --surface: #ffffff;
    --surface-muted: #fafafa;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --accent-ring: rgba(37, 99, 235, 0.12);
    --ok: #047857;
    --ok-soft: #ecfdf5;
    --ok-rule: #a7f3d0;
    --err: #b91c1c;
    --err-soft: #fef2f2;
    --err-rule: #fecaca;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.03);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    padding: 24px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* ============================================================
   * CARD
   * ============================================================ */
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: var(--shadow-sm);
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 24px;
  }

  /* ============================================================
   * DROP ZONE  (label wraps a hidden input)
   * ============================================================ */
  .drop {
    position: relative;
    display: block;
    border: 1.5px dashed var(--rule-strong);
    border-radius: 12px;
    padding: 36px 20px;
    background: var(--surface-muted);
    text-align: center;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .drop:hover,
  .drop.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .drop.has-file {
    padding: 16px;
    text-align: left;
    border-style: solid;
    border-color: var(--rule);
    background: var(--surface);
    cursor: default;
  }
  .drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .drop.has-file input[type="file"] {
    pointer-events: none;
  }

  /* --- empty state content --- */
  .drop-empty {
    display: block;
  }
  .drop.has-file .drop-empty { display: none; }

  .drop-icon {
    width: 40px; height: 40px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    transition: color 0.18s ease;
  }
  .drop:hover .drop-icon,
  .drop.drag .drop-icon {
    color: var(--accent);
  }
  .drop-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .drop-hint {
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* --- file-selected state content --- */
  .file-row {
    display: none;
    align-items: center;
    gap: 12px;
  }
  .drop.has-file .file-row { display: flex; }

  .file-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .file-info {
    flex: 1;
    min-width: 0;
  }
  .file-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-size {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }
  .file-clear {
    background: transparent;
    border: 0;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    line-height: 0;
    transition: color 0.15s, background 0.15s;
    position: relative;
    z-index: 2;
  }
  .file-clear:hover {
    color: var(--err);
    background: var(--err-soft);
  }

  /* ============================================================
   * BUTTON
   * ============================================================ */
  .btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.005em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 2px 8px var(--accent-ring);
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn.is-success {
    background: var(--ok);
    box-shadow: 0 1px 2px rgba(4, 120, 87, 0.2);
    cursor: default;
  }
  .btn.is-success:hover { background: var(--ok); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================================
   * STATUS BANNER  (errors only — success is shown in the button)
   * ============================================================ */
  .status {
    display: none;
    align-items: flex-start;
    gap: 10px;
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.45;
  }
  .status.visible { display: flex; }
  .status.err {
    background: var(--err-soft);
    color: var(--err);
    border: 1px solid var(--err-rule);
  }
  .status svg {
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* ============================================================
   * FOOTER
   * ============================================================ */
  .footer {
    margin-top: 20px;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .footer .dot {
    display: inline-block;
    width: 3px; height: 3px;
    background: var(--ink-faint);
    border-radius: 50%;
    margin: 0 8px;
    vertical-align: middle;
    opacity: 0.6;
  }

  /* ============================================================
   * DEBUG  (only when ?debug=1)
   * ============================================================ */
  .debug {
    display: none;
    margin-top: 12px;
    padding: 8px 10px;
    background: #fef3c7;
    border-radius: 6px;
    font-size: 11px;
    color: #78350f;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    word-break: break-all;
  }
  .debug.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Upload your file</h1>
  <p class="sub">Your file will be securely attached to your record.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.gif,.heic" />

    <!-- Empty state -->
    <div class="drop-empty">
      <div class="drop-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="drop-label">Click to choose a file</div>
      <div class="drop-hint">PDF, Office docs, images &middot; max 25 MB</div>
    </div>

    <!-- File selected state -->
    <div class="file-row">
      <div class="file-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div class="file-info">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>
      <button type="button" class="file-clear" id="clearBtn" aria-label="Remove file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </label>

  <button class="btn" id="uploadBtn" disabled>Upload</button>

  <div class="status" id="status"></div>
  <div class="debug" id="debug"></div>

  <div class="footer">
    Powered by Innovate Today<span class="dot"></span>Secure Upload
  </div>
</div>

<script>
  /* ============================================================
   * CONFIG
   * ============================================================ */
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwuvll3gv0eQFMSL4fzzYR86Y6D9l7hiea02T_gCuobiBMkmCnaD1ekSkXiAHgVc7RcdA/exec';
  const MAX_BYTES = 25 * 1024 * 1024;

  /* ============================================================
   * QUERY PARAMS + ELEMENTS
   * ============================================================ */
  const params = new URLSearchParams(window.location.search);
  const contactId   = params.get('contact_id');
  const locationKey = params.get('location_key');
  const locationId  = params.get('location_id');
  const debugMode   = params.get('debug') === '1';

  const fileInput = document.getElementById('file');
  const drop      = document.getElementById('drop');
  const fileName  = document.getElementById('fileName');
  const fileSize  = document.getElementById('fileSize');
  const clearBtn  = document.getElementById('clearBtn');
  const btn       = document.getElementById('uploadBtn');
  const status    = document.getElementById('status');
  const debug     = document.getElementById('debug');

  let selectedFile = null;

  if (debugMode) {
    debug.classList.add('visible');
    debug.textContent = `contact_id=${contactId || 'MISSING'} | location_key=${locationKey || 'MISSING'} | location_id=${locationId || '(none)'}`;
  }

  /* ============================================================
   * FILE SELECTION
   * ============================================================ */
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  ['dragover', 'dragenter'].forEach(evt =>
    drop.addEventListener(evt, e => {
      e.preventDefault();
      if (!selectedFile) drop.classList.add('drag');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    drop.addEventListener(evt, e => {
      e.preventDefault();
      drop.classList.remove('drag');
    })
  );
  drop.addEventListener('drop', e => {
    if (selectedFile) return;
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  clearBtn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    resetState();
  });

  function setFile(f) {
    hideStatus();
    if (f.size > MAX_BYTES) {
      showError('File too large. Maximum size is 25 MB.');
      return;
    }
    selectedFile = f;
    fileName.textContent = f.name;
    fileSize.textContent = formatSize(f.size);
    drop.classList.add('has-file');
    btn.disabled = false;
    btn.textContent = 'Upload';
    btn.classList.remove('is-success');
  }

  function resetState() {
    selectedFile = null;
    fileInput.value = '';
    drop.classList.remove('has-file');
    btn.disabled = true;
    btn.textContent = 'Upload';
    btn.classList.remove('is-success');
    hideStatus();
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  /* ============================================================
   * UPLOAD
   * ============================================================ */
  btn.addEventListener('click', async () => {
    if (!selectedFile || btn.classList.contains('is-success')) return;
    if (!contactId || !locationKey) {
      showError('Missing contact or location information. Please reload from the original link.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>Uploading</span>';
    hideStatus();

    try {
      const base64 = await fileToBase64(selectedFile);

      const body = new URLSearchParams();
      body.append('contact_id', contactId);
      body.append('location_key', locationKey);
      if (locationId) body.append('location_id', locationId);
      body.append('file_name', selectedFile.name);
      body.append('file_mime', selectedFile.type || 'application/octet-stream');
      body.append('file_data', base64);

      const res = await fetch(WEB_APP_URL, { method: 'POST', body: body });
      const result = await res.json();

      if (result.success) {
        btn.classList.add('is-success');
        btn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Uploaded</span>
        `;
        try {
          window.parent?.postMessage({
            type: 'ghl_upload_complete',
            contactId,
            fileName: selectedFile.name
          }, '*');
        } catch (_) { /* noop */ }
      } else {
        const errMsg = typeof result.error === 'string'
          ? result.error
          : (result.error?.message || 'Upload failed. Please try a different file.');
        showError('Upload failed: ' + errMsg);
        btn.disabled = false;
        btn.textContent = 'Upload';
      }
    } catch (err) {
      showError('Network error: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Upload';
    }
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ============================================================
   * STATUS (errors only)
   * ============================================================ */
  function showError(msg) {
    status.className = 'status visible err';
    status.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>${escapeHtml(msg)}</span>
    `;
  }

  function hideStatus() {
    status.className = 'status';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
</script>
</body>
</html>
