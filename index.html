<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Your File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1220;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --paper: #fafaf7;
    --line: #e2e8f0;
    --accent: #1e40af;
    --accent-soft: #dbeafe;
    --ok: #065f46;
    --ok-soft: #d1fae5;
    --err: #991b1b;
    --err-soft: #fee2e2;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  body {
    padding: 24px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: var(--shadow);
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 22px;
  }
  .drop {
    position: relative;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s ease;
    background: white;
  }
  .drop:hover, .drop.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .drop.has-file {
    border-style: solid;
    border-color: var(--accent);
    background: white;
  }
  .drop input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .drop-icon {
    width: 36px; height: 36px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
  }
  .drop-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .drop-hint {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .file-info {
    display: none;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 4px 0;
  }
  .drop.has-file .file-info { display: flex; }
  .drop.has-file .drop-default { display: none; }
  .file-info-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .file-info-text {
    flex: 1;
    min-width: 0;
  }
  .file-info-name {
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-info-size {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 2px;
  }
  .file-info-clear {
    background: transparent;
    border: 0;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    line-height: 0;
  }
  .file-info-clear:hover { color: var(--err); background: var(--err-soft); }
  button.primary {
    width: 100%;
    margin-top: 18px;
    padding: 13px 16px;
    background: var(--ink);
    color: white;
    border: 0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }
  button.primary:hover:not(:disabled) { background: #1e293b; }
  button.primary:disabled {
    background: var(--ink-faint);
    cursor: not-allowed;
  }
  .status {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
    align-items: flex-start;
    gap: 10px;
  }
  .status.visible { display: flex; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.err { background: var(--err-soft); color: var(--err); }
  .status svg { flex-shrink: 0; margin-top: 1px; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .footer .dot { margin: 0 6px; opacity: 0.4; }
  .debug {
    margin-top: 12px;
    padding: 8px 10px;
    background: #fef3c7;
    border-radius: 6px;
    font-size: 11px;
    color: #78350f;
    font-family: ui-monospace, monospace;
    display: none;
  }
  .debug.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Upload your file</h1>
  <p class="sub">Your file will be securely attached to your record.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.gif,.heic" />
    <div class="drop-default">
      <div class="drop-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="drop-label">Click to choose a file</div>
      <div class="drop-hint">PDF, Office docs, images &middot; max 25 MB</div>
    </div>
    <div class="file-info" id="fileInfo">
      <div class="file-info-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div class="file-info-text">
        <div class="file-info-name" id="fileName"></div>
        <div class="file-info-size" id="fileSize"></div>
      </div>
      <button type="button" class="file-info-clear" id="clearBtn" aria-label="Remove file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </label>

  <button class="primary" id="uploadBtn" disabled>Upload</button>

  <div class="status" id="status"></div>
  <div class="debug" id="debug"></div>

  <div class="footer">
    Powered by Innovate Today<span class="dot">&middot;</span>Secure upload
  </div>
</div>

<script>
  /* =========================================================
   * CONFIG
   * ========================================================= */
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwuvll3gv0eQFMSL4fzzYR86Y6D9l7hiea02T_gCuobiBMkmCnaD1ekSkXiAHgVc7RcdA/exec';
  const MAX_BYTES = 25 * 1024 * 1024;
  /* ========================================================= */

  const params = new URLSearchParams(window.location.search);
  const contactId = params.get('contact_id');
  const locationKey = params.get('location_key');
  const locationId = params.get('location_id');
  const debugMode = params.get('debug') === '1';

  const fileInput = document.getElementById('file');
  const drop = document.getElementById('drop');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const clearBtn = document.getElementById('clearBtn');
  const btn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');
  const debug = document.getElementById('debug');

  let selectedFile = null;

  if (debugMode) {
    debug.classList.add('visible');
    debug.textContent = `contact_id=${contactId || 'MISSING'} | location_key=${locationKey || 'MISSING'} | location_id=${locationId || '(none)'}`;
  }

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  ['dragover', 'dragenter'].forEach(evt =>
    drop.addEventListener(evt, e => {
      e.preventDefault();
      drop.classList.add('drag');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    drop.addEventListener(evt, e => {
      e.preventDefault();
      drop.classList.remove('drag');
    })
  );
  drop.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  clearBtn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    selectedFile = null;
    fileInput.value = '';
    drop.classList.remove('has-file');
    btn.disabled = true;
    hideStatus();
  });

  function setFile(f) {
    hideStatus();
    if (f.size > MAX_BYTES) {
      showStatus('File too large. Maximum size is 25 MB.', 'err');
      return;
    }
    selectedFile = f;
    fileName.textContent = f.name;
    fileSize.textContent = formatSize(f.size);
    drop.classList.add('has-file');
    btn.disabled = false;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  btn.addEventListener('click', async () => {
    if (!selectedFile) return;
    if (!contactId || !locationKey) {
      showStatus('Missing contact or location information. Please reload from the survey.', 'err');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Uploading...';
    hideStatus();

    try {
      const base64 = await fileToBase64(selectedFile);

      const body = new URLSearchParams();
      body.append('contact_id', contactId);
      body.append('location_key', locationKey);
      if (locationId) body.append('location_id', locationId);
      body.append('file_name', selectedFile.name);
      body.append('file_mime', selectedFile.type || 'application/octet-stream');
      body.append('file_data', base64);

      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: body
      });
      const result = await res.json();

      if (result.success) {
        showStatus('File uploaded successfully. You can close this window.', 'ok');
        btn.textContent = 'Uploaded \u2713';
        try {
          window.parent?.postMessage({
            type: 'ghl_upload_complete',
            contactId,
            fileName: selectedFile.name
          }, '*');
        } catch (_) { /* noop */ }
      } else {
        const errMsg = typeof result.error === 'string'
          ? result.error
          : (result.error?.message || 'Upload failed. Please try a different file.');
        showStatus('Upload failed: ' + errMsg, 'err');
        btn.disabled = false;
        btn.textContent = 'Upload';
      }
    } catch (err) {
      showStatus('Network error: ' + err.message, 'err');
      btn.disabled = false;
      btn.textContent = 'Upload';
    }
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showStatus(msg, type) {
    status.className = 'status visible ' + type;
    status.innerHTML = type === 'ok'
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>${escapeHtml(msg)}</span>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>${escapeHtml(msg)}</span>`;
  }

  function hideStatus() {
    status.className = 'status';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
</script>
</body>
</html>
